<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Starfighter</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Courier New",monospace;touch-action:none}
  canvas{display:block;margin:0 auto;height:100vh;max-width:100vw;background:#02020a;image-rendering:pixelated}
</style>
</head>
<body>
<canvas id="c" width="480" height="720"></canvas>
<script>
(() => {
const W = 480, H = 720;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------- Input ----------
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code) || e.code.startsWith('Numpad')) e.preventDefault();
  if (e.code === 'Enter' || e.code === 'NumpadEnter' || e.code === 'Space') { audioInit(); if (state !== 'play') start(); }
  if (e.code === 'KeyP' && (state === 'play' || state === 'pause')) state = state === 'play' ? 'pause' : 'play';
});
addEventListener('keyup', e => keys[e.code] = false);

let touch = null; // {x,y} in game coords
let btnMissile = false, btnShield = false, usedTouch = false;
const BTN_M = { x: 50, y: H - 110, r: 36 }, BTN_S = { x: W - 50, y: H - 110, r: 36 };
function readTouches(e) {
  const r = cv.getBoundingClientRect();
  touch = null; btnMissile = btnShield = false;
  for (const t of e.touches) {
    const x = (t.clientX - r.left) / r.width * W, y = (t.clientY - r.top) / r.height * H;
    if (Math.hypot(x - BTN_M.x, y - BTN_M.y) < BTN_M.r + 10) btnMissile = true;
    else if (Math.hypot(x - BTN_S.x, y - BTN_S.y) < BTN_S.r + 10) btnShield = true;
    else if (!touch) touch = { x, y };
  }
}
cv.addEventListener('touchstart', e => { usedTouch = true; audioInit(); if (state !== 'play') start(); readTouches(e); e.preventDefault(); }, {passive:false});
cv.addEventListener('touchmove', e => { readTouches(e); e.preventDefault(); }, {passive:false});
cv.addEventListener('touchend', e => { readTouches(e); e.preventDefault(); }, {passive:false});
cv.addEventListener('touchcancel', e => readTouches(e));

// ---------- Audio (WebAudio, synthesized) ----------
let ac = null;
function audioInit() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} } if (ac && ac.state === 'suspended') ac.resume(); }
function beep(freq, dur, type = 'square', vol = 0.06, slide = 0) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur);
}
function noise(dur, vol = 0.12) {
  if (!ac) return;
  const n = ac.sampleRate * dur, b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = ac.createBufferSource(), g = ac.createGain();
  s.buffer = b; g.gain.value = vol; s.connect(g); g.connect(ac.destination); s.start();
}
const sfx = {
  missile: () => { noise(0.15, 0.08); beep(260, 0.25, 'sawtooth', 0.05, 300); },
  shieldOn: () => beep(400, 0.12, 'sine', 0.06, 300),
  shoot: () => beep(880, 0.08, 'square', 0.04, -500),
  boom: () => noise(0.3, 0.14),
  hit: () => beep(200, 0.1, 'sawtooth', 0.06, -100),
  power: () => { beep(600, 0.1, 'triangle', 0.08, 600); setTimeout(() => beep(900, 0.12, 'triangle', 0.08, 500), 90); },
  die: () => { noise(0.8, 0.2); beep(300, 0.8, 'sawtooth', 0.1, -280); },
  brick: () => beep(300 + Math.min(combo, 12) * 60, 0.07, 'triangle', 0.07),
  bounce: () => beep(500, 0.06, 'sine', 0.08, 200),
  bomb: () => { noise(0.9, 0.25); beep(120, 0.9, 'sine', 0.2, -90); },
};

// ---------- State ----------
let state = 'title'; // title | play | pause | over
let missiles, bricks, balls, combo, waveDone, player, bullets, ebullets, enemies, particles, powerups, stars, score, hi, level, frame, spawnT, shake, flash;
hi = +(localStorage.getItem('starfighter_hi') || 0);

stars = [];
for (let i = 0; i < 90; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, z: 0.3 + Math.random() * 1.7 });

function start() {
  player = { x: W / 2, y: H - 90, w: 28, h: 32, lives: 3, shield: 0, inv: 120, cd: 0, weapon: 1, wt: 0, bombs: 2, energy: 100, mcd: 0, shieldOn: false, lock: 0 };
  bullets = []; ebullets = []; missiles = []; bricks = []; balls = []; combo = 0; waveDone = 0; enemies = []; particles = []; powerups = [];
  score = 0; level = 1; frame = 0; spawnT = 60; shake = 0; flash = 0;
  state = 'play';
}

// ---------- Helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
function burst(x, y, n, col, spd = 3) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, s = rand(0.5, spd);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(20, 45), max: 45, col });
  }
}
function hitRect(a, b) { return Math.abs(a.x - b.x) < (a.w + b.w) / 2 && Math.abs(a.y - b.y) < (a.h + b.h) / 2; }

// ---------- Enemies ----------
function spawn() {
  const r = Math.random();
  const hpScale = 1 + Math.floor((level - 1) / 3);
  if (r < 0.5) enemies.push({ type: 'drone', x: rand(30, W - 30), y: -30, w: 26, h: 26, hp: 1 * hpScale, vy: rand(1.2, 2) + level * 0.08, ph: Math.random() * 6, pts: 100, fire: rand(60, 200) });
  else if (r < 0.8) { // zigzag wave of 3
    const x0 = rand(80, W - 80);
    for (let i = 0; i < 3; i++) enemies.push({ type: 'wing', x: x0, y: -30 - i * 45, w: 26, h: 24, hp: 1 * hpScale, vy: 2 + level * 0.05, ph: i * 0.8, pts: 150, fire: rand(80, 240), cx: x0 });
  } else if (r < 0.95) enemies.push({ type: 'tank', x: rand(50, W - 50), y: -40, w: 44, h: 38, hp: 5 * hpScale, vy: 0.8, ph: 0, pts: 400, fire: 50 });
  else enemies.push({ type: 'kamikaze', x: rand(30, W - 30), y: -30, w: 22, h: 26, hp: 2, vy: 3.5, ph: 0, pts: 250, fire: 9999 });
}
function spawnBoss() {
  enemies.push({ type: 'boss', x: W / 2, y: -80, w: 120, h: 70, hp: 60 + level * 20, max: 60 + level * 20, vy: 1, ph: 0, pts: 5000, fire: 40, boss: true });
}
function enemyShoot(e, aimed) {
  let a = Math.PI / 2;
  if (aimed) a = Math.atan2(player.y - e.y, player.x - e.x);
  const s = 3 + level * 0.15;
  ebullets.push({ x: e.x, y: e.y + e.h / 2, vx: Math.cos(a) * s, vy: Math.sin(a) * s, w: 8, h: 8 });
}

function killEnemy(e) {
  burst(e.x, e.y, e.boss ? 80 : 18, e.boss ? '#ffd24a' : '#ff8a3a', e.boss ? 6 : 3.5);
  sfx.boom(); score += e.pts * (e.boss ? 1 : 1);
  if (e.boss) { shake = 30; flash = 20; ebullets = []; for (let i = 0; i < 3; i++) powerups.push({ x: e.x + (i - 1) * 40, y: e.y, kind: ['weapon', 'ball', 'bomb'][i], w: 18, h: 18 }); }
  else if (Math.random() < 0.1) powerups.push({ x: e.x, y: e.y, kind: ['weapon', 'shield', 'bomb', 'life', 'ball', 'ball'][Math.floor(Math.random() * 6)], w: 18, h: 18 });
}
function hurtEnemy(e, d) {
  e.hp -= d; e.flash = 4;
  if (e.hp <= 0) { killEnemy(e); e.dead = true; } else sfx.hit();
}
function hurtPlayer() {
  if (player.shieldOn) { player.energy = Math.max(0, player.energy - 5); burst(player.x, player.y - 20, 4, '#5ff', 2); return; }
  if (player.inv > 0) return;
  if (player.shield > 0) { player.shield = 0; player.inv = 60; sfx.hit(); burst(player.x, player.y, 15, '#5ff', 3); return; }
  player.lives--; player.inv = 150; player.weapon = Math.max(1, player.weapon - 1);
  burst(player.x, player.y, 40, '#7df', 5); sfx.die(); shake = 15;
  if (player.lives <= 0) { state = 'over'; if (score > hi) { hi = score; try { localStorage.setItem('starfighter_hi', hi); } catch(e){} } }
}
function bomb() {
  if (player.bombs <= 0) return;
  player.bombs--; sfx.bomb(); flash = 25; shake = 20; ebullets = [];
  for (const e of enemies) { if (e.boss) hurtEnemy(e, 25); else if (e.y > -20) hurtEnemy(e, 99); }
}

// ---------- Secondary weapons ----------
function fireMissiles() {
  const p = player;
  for (const sx of [-1, 1]) missiles.push({ x: p.x + sx * 14, y: p.y, vx: sx * 2.5, vy: -2, spd: 3, w: 8, h: 14, a: -Math.PI / 2 });
  p.energy -= 20; p.mcd = 20; sfx.missile();
}
function explode(x, y) {
  burst(x, y, 22, '#ffb347', 4.5); sfx.boom(); shake = Math.max(shake, 4);
  for (const e of enemies) if (!e.dead && e.y > -10 && Math.hypot(e.x - x, e.y - y) < 55) hurtEnemy(e, 3);
  for (const b of bricks) if (!b.dead && Math.hypot(b.x - x, b.y - y) < 55) hurtBrick(b, 2);
}
function updateSecondary() {
  const p = player;
  if (p.mcd > 0) p.mcd--;
  if ((keys.KeyX || keys.KeyZ || btnMissile) && p.mcd <= 0 && p.energy >= 20) fireMissiles();
  const want = (keys.KeyC || keys.KeyV || btnShield) && p.energy > 0 && p.lock <= 0;
  if (want && !p.shieldOn) sfx.shieldOn();
  p.shieldOn = want;
  if (want) { p.energy -= 0.6; if (p.energy <= 0) { p.energy = 0; p.lock = 90; p.shieldOn = false; sfx.hit(); } }
  else { if (p.lock > 0) p.lock--; p.energy = Math.min(100, p.energy + (p.lock > 0 ? 0.1 : 0.3)); }

  for (const m of missiles) {
    let t = null, best = 1e9;
    for (const e of enemies) if (!e.dead && e.y > 0) { const d = Math.hypot(e.x - m.x, e.y - m.y); if (d < best) { best = d; t = e; } }
    m.spd = Math.min(9, m.spd + 0.25);
    if (t) {
      const want = Math.atan2(t.y - m.y, t.x - m.x);
      let d = want - m.a; d = Math.atan2(Math.sin(d), Math.cos(d));
      m.a += Math.max(-0.12, Math.min(0.12, d));
    } else { const d = -Math.PI / 2 - m.a; m.a += Math.max(-0.05, Math.min(0.05, Math.atan2(Math.sin(d), Math.cos(d)))); }
    m.vx = Math.cos(m.a) * m.spd; m.vy = Math.sin(m.a) * m.spd;
    m.x += m.vx; m.y += m.vy;
    particles.push({ x: m.x - m.vx * 0.8, y: m.y - m.vy * 0.8, vx: rand(-0.3, 0.3), vy: rand(-0.3, 0.3), life: 12, max: 12, col: '#fb5' });
    if (m.x < -20 || m.x > W + 20 || m.y < -30 || m.y > H + 20) { m.dead = true; continue; }
    const box = { x: m.x, y: m.y, w: 10, h: 10 };
    if (enemies.some(e => !e.dead && e.y > -10 && hitRect(box, e)) || bricks.some(b => !b.dead && hitRect(box, b))) {
      m.dead = true;
      for (const e of enemies) if (!e.dead && e.y > -10 && hitRect(box, e)) { hurtEnemy(e, 6); break; }
      explode(m.x, m.y);
    }
  }
  missiles = missiles.filter(m => !m.dead);
  enemies = enemies.filter(e => !e.dead);
}

// ---------- Bricks & ball (breakout) ----------
const BRICK_COLS = ['#e33', '#f93', '#fd3', '#4c4', '#39f', '#a5f'];
function spawnBricks() {
  const cols = 8, rows = 4 + Math.min(2, Math.floor(level / 2)), bw = W / cols;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    if (r > 1 && (c + r) % 5 === 0) continue; // gaps to let enemies/bullets weave
    const hp = 1 + (r === 0 ? Math.min(2, Math.floor(level / 2)) : 0) + (r === 1 && level > 2 ? 1 : 0);
    bricks.push({ x: c * bw + bw / 2, y: -40 - r * 22, w: bw - 3, h: 19, hp, max: hp, col: BRICK_COLS[(r + level) % BRICK_COLS.length] });
  }
  if (!balls.length) launchBall();
}
function launchBall() {
  if (balls.length >= 3) { score += 500; return; }
  balls.push({ x: player.x, y: player.y - 26, vx: rand(-2, 2), vy: -6, r: 6, spd: 6 });
}
function hurtBrick(b, d) {
  b.hp -= d; b.flash = 3;
  if (b.hp <= 0) {
    b.dead = true; burst(b.x, b.y, 8, b.col, 3);
    if (Math.random() < 0.12) powerups.push({ x: b.x, y: b.y, kind: ['weapon', 'shield', 'bomb', 'ball'][Math.floor(Math.random() * 4)], w: 18, h: 18 });
  }
}
function updateBricks() {
  const p = player;
  for (const b of bricks) {
    if (b.flash) b.flash--;
    b.y += b.y < 30 ? 1.2 : 0.12;
  }
  // wall reaches the player's zone: crash
  if (bricks.some(b => b.y + b.h / 2 > H - 130)) { for (const b of bricks) { burst(b.x, b.y, 4, b.col); } bricks = []; waveDone = level; hurtPlayer(); shake = 15; sfx.boom(); }
  // player bullets & enemy bullets stopped by bricks
  for (const bl of bullets) for (const b of bricks) if (!b.dead && !bl.dead && hitRect(bl, b)) { bl.dead = true; hurtBrick(b, 1); sfx.hit(); }
  for (const bl of ebullets) for (const b of bricks) if (!b.dead && !bl.dead && hitRect(bl, b)) { bl.dead = true; burst(bl.x, bl.y, 3, '#f6a', 1.5); }
  // balls
  for (const ball of balls) {
    // magnet: once the ball slips past the ship, pull it back and relaunch
    if (!ball.mag && ball.vy > 0 && ball.y > p.y + 8) { ball.mag = true; sfx.shieldOn(); }
    if (ball.mag) {
      const tx = p.x, ty = p.y - 14, dx = tx - ball.x, dy = ty - ball.y, d = Math.hypot(dx, dy) || 1;
      const sp = Math.max(ball.spd, 7) + 2;
      ball.vx += (dx / d * sp - ball.vx) * 0.25; ball.vy += (dy / d * sp - ball.vy) * 0.25;
      if (d < 20) {
        ball.mag = false; combo = 0; ball.spd = Math.max(5, ball.spd - 0.5);
        const a = (Math.random() - 0.5) * 1.2;
        ball.vx = Math.sin(a) * ball.spd; ball.vy = -Math.cos(a) * ball.spd; ball.y = p.y - 24; sfx.bounce();
      }
    }
    ball.x += ball.vx; ball.y += ball.vy;
    if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); sfx.bounce(); }
    if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); sfx.bounce(); }
    if (ball.y < ball.r) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); sfx.bounce(); }
    if (ball.y > H + 20 && !ball.mag) { ball.dead = true; combo = 0; continue; }
    if (ball.mag) continue;
    // ship as paddle
    if (ball.vy > 0 && Math.abs(ball.x - p.x) < 24 && ball.y + ball.r > p.y - 22 && ball.y - ball.r < p.y + 8) {
      const off = Math.max(-1, Math.min(1, (ball.x - p.x) / 24));
      ball.spd = Math.min(9, ball.spd + 0.15);
      const a = off * 1.05; // up to ~60 degrees
      ball.vx = Math.sin(a) * ball.spd; ball.vy = -Math.cos(a) * ball.spd;
      ball.y = p.y - 22 - ball.r; combo = 0; sfx.bounce();
    }
    // bricks
    for (const b of bricks) {
      if (b.dead) continue;
      const nx = Math.max(b.x - b.w / 2, Math.min(ball.x, b.x + b.w / 2)), ny = Math.max(b.y - b.h / 2, Math.min(ball.y, b.y + b.h / 2));
      const dx = ball.x - nx, dy = ball.y - ny;
      if (dx * dx + dy * dy < ball.r * ball.r) {
        if (Math.abs(dx) > Math.abs(dy)) ball.vx = Math.sign(dx || ball.vx) * Math.abs(ball.vx) * (dx ? 1 : -1) || ball.vx;
        else ball.vy = (dy === 0 ? -ball.vy : Math.sign(dy) * Math.abs(ball.vy));
        ball.y += ball.vy * 0.5;
        combo++; score += 25 * combo; hurtBrick(b, 1); sfx.brick();
        break;
      }
    }
    // enemies
    for (const e of enemies) {
      if (e.dead || e.y < -10) continue;
      if (Math.abs(ball.x - e.x) < e.w / 2 + ball.r && Math.abs(ball.y - e.y) < e.h / 2 + ball.r) {
        ball.vy = ball.y > e.y ? Math.abs(ball.vy) : -Math.abs(ball.vy);
        combo++; score += 25 * combo; hurtEnemy(e, e.boss ? 3 : 2); break;
      }
    }
  }
  balls = balls.filter(b => !b.dead);
  bricks = bricks.filter(b => !b.dead);
  if (waveDone && !bricks.length && waveDone === -level) { waveDone = level; score += 1000; flash = 8; sfx.power(); }
}

// ---------- Update ----------
let bombLatch = false;
function update() {
  frame++;
  // stars always scroll
  for (const s of stars) { s.y += s.z * (state === 'play' ? 1.5 : 0.6); if (s.y > H) { s.y = 0; s.x = Math.random() * W; } }
  if (state !== 'play') return;

  // player movement
  const p = player, sp = 5;
  let dx = 0, dy = 0;
  if (keys.ArrowLeft || keys.KeyA || keys.Numpad4 || keys.Numpad7 || keys.Numpad1) dx -= 1;
  if (keys.ArrowRight || keys.KeyD || keys.Numpad6 || keys.Numpad9 || keys.Numpad3) dx += 1;
  if (keys.ArrowUp || keys.KeyW || keys.Numpad8 || keys.Numpad7 || keys.Numpad9) dy -= 1;
  if (keys.ArrowDown || keys.KeyS || keys.Numpad2 || keys.Numpad1 || keys.Numpad3) dy += 1;
  if (dx && dy) { dx *= 0.707; dy *= 0.707; }
  p.x += dx * sp; p.y += dy * sp;
  if (touch) { // follow finger, offset above it
    const tx = touch.x, ty = touch.y - 60;
    p.x += Math.max(-8, Math.min(8, tx - p.x)); p.y += Math.max(-8, Math.min(8, ty - p.y));
  }
  p.x = Math.max(16, Math.min(W - 16, p.x)); p.y = Math.max(40, Math.min(H - 30, p.y));
  if (p.inv > 0) p.inv--;
  if (p.shield > 0) p.shield -= 0; // shield lasts until hit

  // shooting (auto-fire on touch)
  if (p.cd > 0) p.cd--;
  if ((keys.Space || keys.Numpad0 || touch) && p.cd <= 0) {
    p.cd = p.weapon >= 3 ? 7 : 9;
    const b = (ox, vx) => bullets.push({ x: p.x + ox, y: p.y - 18, vx, vy: -11, w: 4, h: 14 });
    b(0, 0);
    if (p.weapon >= 2) { b(-10, -0.6); b(10, 0.6); }
    if (p.weapon >= 4) { b(-18, -1.6); b(18, 1.6); }
    sfx.shoot();
  }
  if ((keys.KeyB || keys.ShiftLeft) && !bombLatch) { bomb(); bombLatch = true; }
  if (!(keys.KeyB || keys.ShiftLeft)) bombLatch = false;

  // level / spawning
  const bossAlive = enemies.some(e => e.boss);
  if (!bossAlive) {
    if (--spawnT <= 0) {
      spawn(); spawnT = Math.max(18, 65 - level * 5);
    }
    if (!bricks.length && waveDone !== level && waveDone !== -level && score >= level * 4000 - 2500) { spawnBricks(); waveDone = -level; }
    if (score >= level * 4000 && !bossAlive) { spawnBoss(); level++; spawnT = 180; }
  }

  updateSecondary();
  updateBricks();

  // bullets
  for (const b of bullets) { b.x += b.vx; b.y += b.vy; }
  bullets = bullets.filter(b => b.y > -20 && b.x > -10 && b.x < W + 10);
  for (const b of ebullets) { b.x += b.vx; b.y += b.vy; }
  ebullets = ebullets.filter(b => b.y < H + 20 && b.y > -20 && b.x > -20 && b.x < W + 20);

  // enemies
  for (const e of enemies) {
    e.ph += 0.05; if (e.flash) e.flash--;
    if (e.type === 'drone') { e.y += e.vy; e.x += Math.sin(e.ph) * 1.5; }
    else if (e.type === 'wing') { e.y += e.vy; e.x = e.cx + Math.sin(e.ph * 1.5) * 90; }
    else if (e.type === 'tank') { e.y += e.vy; }
    else if (e.type === 'kamikaze') { e.y += e.vy; e.x += Math.sign(p.x - e.x) * Math.min(2.2, Math.abs(p.x - e.x)); }
    else if (e.type === 'boss') {
      if (e.y < 90) e.y += e.vy; else e.x = W / 2 + Math.sin(e.ph * 0.7) * (W / 2 - 90);
    }
    if (e.type === 'boss' && e.y >= 90) {
      if (--e.fire <= 0) {
        e.fire = e.hp < e.max / 2 ? 22 : 38;
        const n = e.hp < e.max / 2 ? 9 : 5;
        for (let i = 0; i < n; i++) { const a = Math.PI / 2 + (i - (n - 1) / 2) * 0.28; ebullets.push({ x: e.x, y: e.y + 30, vx: Math.cos(a) * 3.2, vy: Math.sin(a) * 3.2, w: 8, h: 8 }); }
      }
    } else if (e.type !== 'boss' && e.y > 0 && e.y < H - 200 && --e.fire <= 0) {
      e.fire = rand(90, 220) - level * 6; enemyShoot(e, e.type === 'tank' || level > 2);
    }
    if (hitRect(e, p) && !e.dead) { if (!e.boss) hurtEnemy(e, 99); hurtPlayer(); }
    if (e.y > H + 50) e.dead = true;
  }
  // player bullets cancel enemy bullets on contact
  for (const b of bullets) for (const eb of ebullets) {
    if (!b.dead && !eb.dead && hitRect(b, { x: eb.x, y: eb.y, w: 12, h: 12 })) { b.dead = eb.dead = true; burst(eb.x, eb.y, 4, '#f9c', 1.8); score += 5; }
  }
  bullets = bullets.filter(b => !b.dead);
  ebullets = ebullets.filter(b => !b.dead);
  // bullet vs enemy
  for (const b of bullets) for (const e of enemies) {
    if (!e.dead && !b.dead && e.y > -10 && hitRect(b, e)) { b.dead = true; hurtEnemy(e, 1); }
  }
  bullets = bullets.filter(b => !b.dead);
  enemies = enemies.filter(e => !e.dead);
  // enemy bullet vs player
  for (const b of ebullets) if (hitRect(b, { x: p.x, y: p.y, w: 12, h: 16 })) { b.dead = true; hurtPlayer(); }
  ebullets = ebullets.filter(b => !b.dead);

  // powerups
  for (const u of powerups) {
    u.y += 1.5;
    if (hitRect(u, p)) {
      u.dead = true; sfx.power(); score += 200;
      if (u.kind === 'weapon') p.weapon = Math.min(4, p.weapon + 1);
      if (u.kind === 'shield') p.shield = 1;
      if (u.kind === 'bomb') p.bombs = Math.min(5, p.bombs + 1);
      if (u.kind === 'ball') launchBall();
      if (u.kind === 'life') p.lives = Math.min(6, p.lives + 1);
    }
  }
  powerups = powerups.filter(u => !u.dead && u.y < H + 20);

  // particles
  for (const q of particles) { q.x += q.vx; q.y += q.vy; q.vx *= 0.97; q.vy *= 0.97; q.life--; }
  particles = particles.filter(q => q.life > 0);
  if (p.inv < 100 && frame % 3 === 0) particles.push({ x: p.x + rand(-4, 4), y: p.y + 16, vx: rand(-0.3, 0.3), vy: rand(1.5, 3), life: 14, max: 14, col: '#4af' });
  if (shake > 0) shake--; if (flash > 0) flash--;
}

// ---------- Drawing ----------
function poly(pts, fill, stroke) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1.5; ctx.stroke(); }
}
function drawPlayer() {
  const p = player; if (p.inv > 0 && Math.floor(p.inv / 4) % 2 === 0 && state === 'play') return;
  ctx.save(); ctx.translate(p.x, p.y);
  // flame
  const f = 8 + Math.random() * 8;
  poly([[-5, 12], [0, 12 + f], [5, 12]], '#ff9a2e');
  poly([[-14, 8], [-14, 8 + f * 0.6], [-9, 8]], '#ff9a2e'); poly([[14, 8], [14, 8 + f * 0.6], [9, 8]], '#ff9a2e');
  // wings
  poly([[-5, -4], [-22, 16], [-8, 12]], '#2a6df4', '#9cf');
  poly([[5, -4], [22, 16], [8, 12]], '#2a6df4', '#9cf');
  // body
  poly([[0, -22], [8, 8], [5, 14], [-5, 14], [-8, 8]], '#dfe8ff', '#fff');
  poly([[0, -12], [3, -2], [-3, -2]], '#27d', null);
  ctx.restore();
  if (p.shieldOn) { const g = ctx.createRadialGradient(p.x, p.y, 8, p.x, p.y, 32); g.addColorStop(0, 'rgba(80,255,255,0.05)'); g.addColorStop(1, 'rgba(80,255,255,0.45)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, 32, 0, 6.283); ctx.fill(); ctx.strokeStyle = '#8ff'; ctx.lineWidth = 2; ctx.stroke(); }
  if (p.shield) { ctx.strokeStyle = `rgba(80,255,255,${0.5 + 0.3 * Math.sin(frame / 5)})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y, 26, 0, 6.283); ctx.stroke(); }
}
function drawEnemy(e) {
  ctx.save(); ctx.translate(e.x, e.y);
  const hit = e.flash > 0;
  const c = (col) => hit ? '#fff' : col;
  if (e.type === 'drone') { poly([[0, 13], [13, -8], [6, -13], [-6, -13], [-13, -8]], c('#e33'), '#fa8'); ctx.fillStyle = '#ff0'; ctx.fillRect(-3, -4, 6, 6); }
  else if (e.type === 'wing') { poly([[0, 12], [14, -6], [8, -12], [0, -6], [-8, -12], [-14, -6]], c('#b4f'), '#e9f'); }
  else if (e.type === 'tank') { poly([[0, 19], [22, 6], [22, -12], [10, -19], [-10, -19], [-22, -12], [-22, 6]], c('#4a6'), '#9f9'); ctx.fillStyle = '#143'; ctx.fillRect(-8, -8, 16, 14); ctx.fillStyle = '#f44'; ctx.fillRect(-3, -3, 6, 6); }
  else if (e.type === 'kamikaze') { poly([[0, 13], [11, -6], [0, -13], [-11, -6]], c('#fa0'), '#ff8'); }
  else if (e.type === 'boss') {
    poly([[0, 35], [60, 0], [50, -30], [20, -35], [-20, -35], [-50, -30], [-60, 0]], c('#823'), '#f68');
    poly([[0, 22], [30, 0], [20, -22], [-20, -22], [-30, 0]], c('#c46'), '#fac');
    ctx.fillStyle = '#ff0'; ctx.beginPath(); ctx.arc(0, -2, 9, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#f33'; ctx.fillRect(-48, -4, 10, 14); ctx.fillRect(38, -4, 10, 14);
  }
  ctx.restore();
  if (e.boss) { // health bar
    ctx.fillStyle = '#300'; ctx.fillRect(60, 12, W - 120, 8);
    ctx.fillStyle = '#f44'; ctx.fillRect(60, 12, (W - 120) * Math.max(0, e.hp / e.max), 8);
    ctx.strokeStyle = '#fff'; ctx.strokeRect(60, 12, W - 120, 8);
  }
}
function text(s, x, y, size = 16, col = '#fff', align = 'left') {
  ctx.font = `bold ${size}px "Courier New",monospace`; ctx.textAlign = align; ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function drawLifeIcon(x, y) { poly([[x, y - 8], [x + 6, y + 6], [x - 6, y + 6]], '#9cf'); }

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake / 3, shake / 3), rand(-shake / 3, shake / 3));
  ctx.fillStyle = '#02020a'; ctx.fillRect(-20, -20, W + 40, H + 40);
  for (const s of stars) { ctx.fillStyle = `rgba(255,255,255,${0.3 + s.z * 0.3})`; ctx.fillRect(s.x, s.y, s.z > 1.2 ? 2 : 1, s.z > 1.2 ? 2 : 1); }

  if (state !== 'title') {
    for (const u of powerups) {
      const col = { weapon: '#f80', shield: '#0cf', bomb: '#f33', life: '#3f6', ball: '#fff' }[u.kind];
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(u.x, u.y, 10, 0, 6.283); ctx.fill();
      text({ weapon: 'W', shield: 'S', bomb: 'B', life: '+', ball: 'O' }[u.kind], u.x, u.y + 5, 13, '#000', 'center');
    }
    for (const b of bricks) {
      ctx.fillStyle = b.flash ? '#fff' : b.col; ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
      ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, 4);
      ctx.strokeStyle = b.hp > 1 ? '#fff' : 'rgba(0,0,0,0.5)'; ctx.lineWidth = b.hp > 1 ? 2 : 1; ctx.strokeRect(b.x - b.w / 2 + .5, b.y - b.h / 2 + .5, b.w - 1, b.h - 1);
    }
    for (const e of enemies) drawEnemy(e);
    for (const m of missiles) { ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(m.a + Math.PI / 2); poly([[0, -8], [3.5, 4], [-3.5, 4]], '#fff', '#f84'); poly([[-3.5, 4], [-6, 8], [-2, 5]], '#f84'); poly([[3.5, 4], [6, 8], [2, 5]], '#f84'); ctx.restore(); }
    for (const ball of balls) {
      const g = ctx.createRadialGradient(ball.x, ball.y, 1, ball.x, ball.y, 14);
      g.addColorStop(0, 'rgba(255,255,255,0.9)'); g.addColorStop(1, 'rgba(120,200,255,0)');
      ctx.fillStyle = g; ctx.fillRect(ball.x - 14, ball.y - 14, 28, 28);
      if (ball.mag) { ctx.strokeStyle = 'rgba(120,220,255,0.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(ball.x, ball.y); ctx.stroke(); }
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, 6.283); ctx.fill();
    }
    ctx.fillStyle = '#9ff'; for (const b of bullets) ctx.fillRect(b.x - 2, b.y - 7, 4, 14);
    ctx.fillStyle = '#f6a'; for (const b of ebullets) { ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, 6.283); ctx.fill(); }
    if (state !== 'over') drawPlayer();
    for (const q of particles) { ctx.globalAlpha = q.life / q.max; ctx.fillStyle = q.col; ctx.fillRect(q.x - 1.5, q.y - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    // HUD
    text('SCORE ' + String(score).padStart(7, '0'), 10, 24, 16);
    text('HI ' + String(hi).padStart(7, '0'), W - 10, 24, 16, '#fd5', 'right');
    text('LV ' + level, W / 2, 24, 16, '#8f8', 'center');
    // energy bar
    const ep = player.energy / 100;
    ctx.fillStyle = '#012'; ctx.fillRect(10, H - 44, 100, 8);
    ctx.fillStyle = player.lock > 0 ? '#f44' : ep < 0.2 ? '#fa4' : '#4df'; ctx.fillRect(10, H - 44, 100 * ep, 8);
    ctx.strokeStyle = '#8ab'; ctx.lineWidth = 1; ctx.strokeRect(10.5, H - 43.5, 100, 8);
    text('ENERGY', 114, H - 36, 11, '#8ab');
    if (usedTouch) for (const [b, label, on] of [[BTN_M, 'MSL', btnMissile], [BTN_S, 'SHD', btnShield]]) {
      ctx.globalAlpha = on ? 0.7 : 0.35; ctx.fillStyle = b === BTN_M ? '#f84' : '#4df';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.283); ctx.fill(); ctx.globalAlpha = 1;
      text(label, b.x, b.y + 5, 14, '#fff', 'center');
    }
    for (let i = 0; i < player.lives; i++) drawLifeIcon(20 + i * 18, H - 16);
    text('BOMBS ' + '●'.repeat(player.bombs), W - 10, H - 10, 14, '#f66', 'right');
    if (combo > 1) text('COMBO x' + combo, W / 2, 48, 16, '#fd5', 'center');
    text('PWR ' + player.weapon, W / 2, H - 10, 14, '#fa4', 'center');
  }
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash / 30})`; ctx.fillRect(0, 0, W, H); }
  ctx.restore();

  if (state === 'title') {
    text('STARFIGHTER', W / 2, 250, 48, '#6cf', 'center');
    text('— ARCADE —', W / 2, 285, 18, '#fd5', 'center');
    if (Math.floor(frame / 30) % 2 === 0 || true) text('PRESS ENTER / TAP TO START', W / 2, 390, 18, Math.floor(Date.now() / 500) % 2 ? '#fff' : '#888', 'center');
    text('ARROWS / WASD / NUMPAD  move', W / 2, 460, 14, '#aaa', 'center');
    text('SPACE / NUM0 fire   X missiles   C shield   B bomb', W / 2, 484, 14, '#aaa', 'center');
    text('O power-up: bounce the ball off your ship', W / 2, 532, 14, '#aaa', 'center');
    text('P  pause     touch: drag to fly', W / 2, 508, 14, '#aaa', 'center');
    text('HI ' + hi, W / 2, 590, 16, '#fd5', 'center');
  } else if (state === 'pause') {
    text('PAUSED', W / 2, H / 2, 40, '#fff', 'center');
  } else if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, W, H);
    text('GAME OVER', W / 2, 290, 44, '#f55', 'center');
    text('SCORE ' + score, W / 2, 340, 22, '#fff', 'center');
    if (score >= hi && score > 0) text('NEW HIGH SCORE!', W / 2, 372, 18, '#fd5', 'center');
    text('PRESS ENTER / TAP TO RETRY', W / 2, 430, 16, Math.floor(Date.now() / 500) % 2 ? '#fff' : '#888', 'center');
  }
}

// ---------- Loop (fixed 60Hz step) ----------
let last = performance.now(), acc = 0;
function loop(t) {
  acc += Math.min(100, t - last); last = t;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
