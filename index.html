<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Starfighter</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Courier New",monospace;touch-action:none}
  canvas{display:block;margin:0 auto;height:100vh;max-width:100vw;background:#02020a;image-rendering:pixelated}
</style>
</head>
<body>
<canvas id="c" width="480" height="720"></canvas>
<script>
(() => {
const W = 480, H = 720;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------- Input ----------
const keys = {};
// Numpad keys report different codes/keys depending on browser, layout and NumLock,
// so map by physical location (3) and key name to a canonical NumpadN code.
const NUMPAD_KEYS = { Insert: 0, End: 1, ArrowDown: 2, PageDown: 3, ArrowLeft: 4, Clear: 5, ArrowRight: 6, Home: 7, ArrowUp: 8, PageUp: 9 };
function keyCode(e) {
  if (e.location === 3) {
    if (/^[0-9]$/.test(e.key)) return 'Numpad' + e.key;
    if (e.key in NUMPAD_KEYS) return 'Numpad' + NUMPAD_KEYS[e.key];
    if (e.key === 'Enter') return 'NumpadEnter';
  }
  return e.code;
}
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
addEventListener('keydown', e => {
  const code = keyCode(e);
  keys[code] = true; keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code) || code.startsWith('Numpad') || e.location === 3) e.preventDefault();
  if (code === 'Enter' || code === 'NumpadEnter' || code === 'Space') { audioInit(); if (state === 'title' || state === 'over') start(); }
  if (state === 'upgrade') { const n = { Digit1: 0, Digit2: 1, Digit3: 2, Numpad1: 0, Numpad2: 1, Numpad3: 2 }[code]; if (n !== undefined) pickUpgrade(n); }
  if (e.code === 'KeyP' && (state === 'play' || state === 'pause')) state = state === 'play' ? 'pause' : 'play';
});
addEventListener('keyup', e => { keys[keyCode(e)] = false; keys[e.code] = false; });

let touch = null; // {x,y} in game coords
let btnMissile = false, btnShield = false, usedTouch = false;
const BTN_M = { x: 50, y: H - 110, r: 36 }, BTN_S = { x: W - 50, y: H - 110, r: 36 };
function readTouches(e) {
  const r = cv.getBoundingClientRect();
  touch = null; btnMissile = btnShield = false;
  for (const t of e.touches) {
    const x = (t.clientX - r.left) / r.width * W, y = (t.clientY - r.top) / r.height * H;
    if (Math.hypot(x - BTN_M.x, y - BTN_M.y) < BTN_M.r + 10) btnMissile = true;
    else if (Math.hypot(x - BTN_S.x, y - BTN_S.y) < BTN_S.r + 10) btnShield = true;
    else if (!touch) touch = { x, y };
  }
}
cv.addEventListener('touchstart', e => { usedTouch = true; audioInit(); if (state === 'title' || state === 'over') start(); readTouches(e); if (state === 'upgrade') pickAt(e.touches[0]); e.preventDefault(); }, {passive:false});
cv.addEventListener('click', e => { if (state === 'upgrade') pickAt(e); });
function pickAt(pt) {
  const r = cv.getBoundingClientRect(), y = (pt.clientY - r.top) / r.height * H;
  for (let i = 0; i < upChoices.length; i++) if (y >= CARD_Y + i * 120 && y <= CARD_Y + i * 120 + 106) pickUpgrade(i);
}
cv.addEventListener('touchmove', e => { readTouches(e); e.preventDefault(); }, {passive:false});
cv.addEventListener('touchend', e => { readTouches(e); e.preventDefault(); }, {passive:false});
cv.addEventListener('touchcancel', e => readTouches(e));

// ---------- Audio (WebAudio, synthesized) ----------
let ac = null;
function audioInit() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} } if (ac && ac.state === 'suspended') ac.resume(); }
function beep(freq, dur, type = 'square', vol = 0.06, slide = 0) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur);
}
function noise(dur, vol = 0.12) {
  if (!ac) return;
  const n = ac.sampleRate * dur, b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = ac.createBufferSource(), g = ac.createGain();
  s.buffer = b; g.gain.value = vol; s.connect(g); g.connect(ac.destination); s.start();
}
const sfx = {
  missile: () => { noise(0.15, 0.08); beep(260, 0.25, 'sawtooth', 0.05, 300); },
  shieldOn: () => beep(400, 0.12, 'sine', 0.06, 300),
  shoot: () => beep(880, 0.08, 'square', 0.04, -500),
  boom: () => noise(0.3, 0.14),
  hit: () => beep(200, 0.1, 'sawtooth', 0.06, -100),
  power: () => { beep(600, 0.1, 'triangle', 0.08, 600); setTimeout(() => beep(900, 0.12, 'triangle', 0.08, 500), 90); },
  die: () => { noise(0.8, 0.2); beep(300, 0.8, 'sawtooth', 0.1, -280); },
  brick: () => beep(300 + Math.min(combo, 12) * 60, 0.07, 'triangle', 0.07),
  bounce: () => beep(500, 0.06, 'sine', 0.08, 200),
  bomb: () => { noise(0.9, 0.25); beep(120, 0.9, 'sine', 0.2, -90); },
};

// ---------- State ----------
let state = 'title'; // title | play | pause | over
let stage, banner, beams, beamT, bombing, blobs, st, upChoices, upFrame, missiles, bricks, balls, combo, waveDone, player, bullets, ebullets, enemies, particles, powerups, stars, score, hi, level, frame, spawnT, shake, flash;
hi = +(localStorage.getItem('starfighter_hi') || 0);

stars = [];
for (let i = 0; i < 90; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, z: 0.3 + Math.random() * 1.7 });

function start() {
  player = { x: W / 2, y: H - 90, w: 28, h: 32, lives: 3, shield: 0, inv: 120, cd: 0, weapon: 1, wt: 0, bombs: 2, energy: 100, mcd: 0, shieldOn: false, lock: 0, lvl: 1, xp: 0, xpNext: 250, pending: 0, lvlFlash: 0 };
  st = {}; for (const u of UPGRADES) st[u.id] = 0; upChoices = [];
  stage = 1; banner = { t: 150, l1: 'STAGE 1', l2: THEMES[0].name }; beams = []; beamT = 200; bombing = false;
  bullets = []; ebullets = []; missiles = []; bricks = []; balls = []; combo = 0; waveDone = 0; enemies = []; particles = []; powerups = [];
  score = 0; level = 1; frame = 0; spawnT = 60; shake = 0; flash = 0;
  state = 'play';
}

// ---------- Ship leveling ----------
const CARD_Y = 190;
const maxEnergy = () => 100 + 20 * st.enr;
const dmgMul = () => 1 + 0.25 * st.dmg;
const mslCost = () => Math.max(10, 20 - st.msl);
const UPGRADES = [
  { id: 'dmg', name: 'Plasma Cores', desc: '+25% main gun damage', max: 8 },
  { id: 'rate', name: 'Rapid Fire', desc: 'Main gun fires 10% faster', max: 6 },
  { id: 'spd', name: 'Thrusters', desc: '+8% ship speed', max: 5 },
  { id: 'wpn', name: 'Cannon Array', desc: 'Add shot streams (weapon +1)', max: 3, ok: () => player.weapon < 4, apply: () => player.weapon++ },
  { id: 'enr', name: 'Capacitor', desc: '+20 max energy', max: 6 },
  { id: 'reg', name: 'Recharger', desc: '+25% energy regeneration', max: 6 },
  { id: 'shd', name: 'Shield Matrix', desc: 'Shield drains 12% less energy', max: 5 },
  { id: 'msl', name: 'Missile Pods', desc: 'Stronger, cheaper missiles; +pair every 3', max: 8 },
  { id: 'ball', name: 'Ball Core', desc: 'Ball hits harder', max: 5 },
  { id: 'mag', name: 'Tractor Field', desc: 'Pull in power-ups from afar', max: 4 },
  { id: 'hull', name: 'Hull Repair', desc: '+1 life', max: 99, ok: () => player.lives < 6, apply: () => player.lives++, noLevel: true },
  { id: 'bay', name: 'Bomb Bay', desc: '+2 bombs', max: 99, ok: () => player.bombs < 5, apply: () => player.bombs = Math.min(5, player.bombs + 2), noLevel: true },
];
function addXp(n) {
  const p = player; if (!p || state === 'over') return;
  p.xp += n;
  while (p.xp >= p.xpNext) { p.xp -= p.xpNext; p.lvl++; p.pending++; p.xpNext = Math.round(250 * Math.pow(1.4, p.lvl - 1)); p.lvlFlash = 90; sfx.power(); }
}
function openUpgrade() {
  const pool = UPGRADES.filter(u => st[u.id] < u.max && (!u.ok || u.ok()));
  upChoices = [];
  while (upChoices.length < 3 && pool.length) upChoices.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  if (!upChoices.length) { player.pending = 0; return; }
  upFrame = frame; state = 'upgrade';
}
function pickUpgrade(i) {
  if (state !== 'upgrade' || frame - upFrame < 30 || !upChoices[i]) return;
  const u = upChoices[i];
  if (u.apply) u.apply();
  if (!u.noLevel) st[u.id]++;
  player.energy = Math.min(maxEnergy(), player.energy + 30);
  sfx.power(); burst(player.x, player.y, 25, '#8f8', 4);
  player.pending--; player.inv = Math.max(player.inv, 90);
  state = 'play';
  if (player.pending > 0) openUpgrade();
}

// ---------- Helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
function burst(x, y, n, col, spd = 3) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, s = rand(0.5, spd);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(20, 45), max: 45, col });
  }
}
function hitRect(a, b) { return Math.abs(a.x - b.x) < (a.w + b.w) / 2 && Math.abs(a.y - b.y) < (a.h + b.h) / 2; }

// ---------- Stage themes ----------
const THEMES = [
  { name: 'DEEP SPACE', bg: ['#02020a', '#050522'], blob: '90,110,255', star: '#fff',
    spawn: [['drone', 5], ['wing', 3], ['tank', 1.5], ['kamikaze', 0.5], ['line', 0.6]] },
  { name: 'ASTEROID BELT', bg: ['#0a0503', '#1d1109'], blob: '200,130,70', star: '#fdb',
    spawn: [['asteroid', 5], ['drone', 2], ['kamikaze', 1.5], ['tank', 1], ['line', 0.5]] },
  { name: 'CRIMSON NEBULA', bg: ['#12020d', '#2b0719'], blob: '255,60,140', star: '#fcd',
    spawn: [['wing', 3], ['sniper', 2.5], ['swarm', 2], ['drone', 2], ['mine', 0.6]] },
  { name: 'IRON FORTRESS', bg: ['#03070b', '#0e1a25'], blob: '120,160,190', star: '#cde',
    spawn: [['tank', 3], ['mine', 2.5], ['sniper', 2], ['drone', 1.5], ['line', 1]] },
  { name: 'ION STORM', bg: ['#00100f', '#02302d'], blob: '60,255,220', star: '#bff',
    spawn: [['swarm', 3], ['kamikaze', 2.5], ['mine', 2], ['wing', 2], ['asteroid', 1]] },
];
const theme = () => THEMES[(stage - 1) % THEMES.length];
stage = 1; banner = { t: 0 }; beams = [];
blobs = [];
for (let i = 0; i < 5; i++) blobs.push({ x: Math.random() * W, y: Math.random() * H, r: rand0(90, 200), z: 0.3 + Math.random() * 0.7 });
function rand0(a, b) { return a + Math.random() * (b - a); }

// ---------- Enemies ----------
function pickType() {
  const tbl = theme().spawn; let r = Math.random() * tbl.reduce((a, t) => a + t[1], 0);
  for (const [t, w] of tbl) { if ((r -= w) < 0) return t; }
  return tbl[0][0];
}
function spawn() {
  const hpScale = 1 + Math.floor((level - 1) / 3);
  const drone = (x, y, vy, ph) => enemies.push({ type: 'drone', x, y, w: 26, h: 26, hp: 1 * hpScale, vy, ph, pts: 100, fire: rand(60, 200) });
  switch (pickType()) {
    case 'drone': drone(rand(30, W - 30), -30, rand(1.2, 2) + level * 0.08, Math.random() * 6); break;
    case 'line': for (let i = 0; i < 6; i++) drone(65 + i * 70, -30, 1.6, 0); break;
    case 'wing': { // zigzag wave of 3
      const x0 = rand(80, W - 80);
      for (let i = 0; i < 3; i++) enemies.push({ type: 'wing', x: x0, y: -30 - i * 45, w: 26, h: 24, hp: 1 * hpScale, vy: 2 + level * 0.05, ph: i * 0.8, pts: 150, fire: rand(80, 240), cx: x0 });
      break;
    }
    case 'tank': enemies.push({ type: 'tank', x: rand(50, W - 50), y: -40, w: 44, h: 38, hp: 5 * hpScale, vy: 0.8, ph: 0, pts: 400, fire: 50 }); break;
    case 'kamikaze': enemies.push({ type: 'kamikaze', x: rand(30, W - 30), y: -30, w: 22, h: 26, hp: 2, vy: 3.5, ph: 0, pts: 250, fire: 9999 }); break;
    case 'asteroid': enemies.push({ type: 'asteroid', size: 2, x: rand(40, W - 40), y: -40, w: 38, h: 38, hp: 4 * hpScale, vy: rand(1, 1.9), vx: rand(-1, 1), rot: 0, vr: rand(-0.04, 0.04), shape: Array.from({ length: 9 }, () => rand(0.7, 1)), pts: 80, fire: 9999 }); break;
    case 'sniper': enemies.push({ type: 'sniper', x: rand(130, W - 130), cx: rand(130, W - 130), y: -30, w: 32, h: 26, hp: 4 * hpScale, vy: 0, ph: 0, life: 0, hold: rand(70, 140), cd: 70, burst: 0, pts: 350, fire: 9999 }); break;
    case 'swarm': { // V formation of fast darts
      const x0 = rand(90, W - 90);
      for (let i = 0; i < 5; i++) { const k = Math.ceil(i / 2) * (i % 2 ? 1 : -1); enemies.push({ type: 'dart', x: x0 + k * 30, y: -30 - Math.abs(k) * 26, w: 16, h: 20, hp: 1, vy: 4.2, ph: 0, pts: 60, fire: 9999 }); }
      break;
    }
    case 'mine': enemies.push({ type: 'mine', x: rand(40, W - 40), y: -30, w: 26, h: 26, hp: 2, vy: 0.9, ph: Math.random() * 6, pts: 200, fire: 9999 }); break;
  }
}
const BOSS_NAMES = ['DREADNOUGHT', 'HELIX', 'HIVEMIND'];
function spawnBoss() {
  const kind = (level - 1) % 3, hp = 60 + level * 20;
  enemies.push({ type: 'boss', kind, sp: 0, t: 0, x: W / 2, y: -80, w: 120, h: 70, hp, max: hp, vy: 1, ph: 0, pts: 5000, fire: 40, boss: true });
  banner = { t: 150, l1: 'WARNING', l2: BOSS_NAMES[kind] };
}
function enemyShoot(e, aimed) {
  let a = Math.PI / 2;
  if (aimed) a = Math.atan2(player.y - e.y, player.x - e.x);
  const s = 3 + level * 0.15;
  ebullets.push({ x: e.x, y: e.y + e.h / 2, vx: Math.cos(a) * s, vy: Math.sin(a) * s, w: 8, h: 8 });
}

function killEnemy(e) {
  burst(e.x, e.y, e.boss ? 80 : 18, e.boss ? '#ffd24a' : '#ff8a3a', e.boss ? 6 : 3.5);
  sfx.boom(); score += e.pts; addXp(Math.round(e.pts / 10));
  if (e.type === 'asteroid' && e.size === 2) for (const sx of [-1, 1]) enemies.push({ type: 'asteroid', size: 1, x: e.x, y: e.y, w: 18, h: 18, hp: 1, vy: e.vy + 0.4, vx: sx * 1.4, rot: 0, vr: rand(-0.1, 0.1), shape: Array.from({ length: 7 }, () => rand(0.7, 1)), pts: 30, fire: 9999 });
  if (e.type === 'mine' && !bombing) for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4 + 0.4; ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 2.6, vy: Math.sin(a) * 2.6, w: 8, h: 8 }); }
  if (e.boss) { stage++; banner = { t: 180, l1: 'STAGE ' + stage, l2: theme().name }; }
  if (e.boss) { shake = 30; flash = 20; ebullets = []; for (let i = 0; i < 3; i++) powerups.push({ x: e.x + (i - 1) * 40, y: e.y, kind: ['weapon', 'ball', 'bomb'][i], w: 18, h: 18 }); }
  else if (Math.random() < 0.1) powerups.push({ x: e.x, y: e.y, kind: ['weapon', 'shield', 'bomb', 'life', 'ball', 'ball'][Math.floor(Math.random() * 6)], w: 18, h: 18 });
}
function hurtEnemy(e, d) {
  e.hp -= d; e.flash = 4;
  if (e.hp <= 0) { killEnemy(e); e.dead = true; } else sfx.hit();
}
function hurtPlayer() {
  if (player.shieldOn) { player.energy = Math.max(0, player.energy - 5); burst(player.x, player.y - 20, 4, '#5ff', 2); return; }
  if (player.inv > 0) return;
  if (player.shield > 0) { player.shield = 0; player.inv = 60; sfx.hit(); burst(player.x, player.y, 15, '#5ff', 3); return; }
  player.lives--; player.inv = 150; player.weapon = Math.max(1, player.weapon - 1);
  burst(player.x, player.y, 40, '#7df', 5); sfx.die(); shake = 15;
  if (player.lives <= 0) { state = 'over'; if (score > hi) { hi = score; try { localStorage.setItem('starfighter_hi', hi); } catch(e){} } }
}
function bomb() {
  if (player.bombs <= 0) return;
  player.bombs--; sfx.bomb(); bombing = true; flash = 25; shake = 20; ebullets = [];
  for (const e of enemies) { if (e.boss) hurtEnemy(e, 25); else if (e.y > -20) hurtEnemy(e, 99); }
  bombing = false;
}

// ---------- Secondary weapons ----------
function fireMissiles() {
  const p = player;
  const pairs = 1 + Math.floor(st.msl / 3);
  for (let k = 0; k < pairs; k++) for (const sx of [-1, 1]) missiles.push({ x: p.x + sx * (14 + k * 8), y: p.y, vx: sx * (2.5 + k), vy: -2, spd: 3, w: 8, h: 14, a: -Math.PI / 2 });
  p.energy -= mslCost(); p.mcd = 20; sfx.missile();
}
function explode(x, y) {
  burst(x, y, 22, '#ffb347', 4.5); sfx.boom(); shake = Math.max(shake, 4);
  for (const e of enemies) if (!e.dead && e.y > -10 && Math.hypot(e.x - x, e.y - y) < 55 + 5 * st.msl) hurtEnemy(e, 3 + st.msl);
  for (const b of bricks) if (!b.dead && Math.hypot(b.x - x, b.y - y) < 55 + 5 * st.msl) hurtBrick(b, 2);
}
function updateBeams() {
  const p = player;
  if ((stage - 1) % THEMES.length === 4 && !enemies.some(e => e.boss) && --beamT <= 0) { beams.push({ x: Math.random() < 0.6 ? p.x : rand(30, W - 30), t: 0 }); beamT = Math.max(150, 330 - level * 12); }
  for (const b of beams) { b.t++; if (b.t >= 70 && b.t < 95 && !b.hit && Math.abs(p.x - b.x) < 16) { b.hit = true; hurtPlayer(); } }
  beams = beams.filter(b => b.t < 95);
}
function updateSecondary() {
  const p = player;
  if (p.mcd > 0) p.mcd--;
  if ((keys.KeyX || keys.KeyZ || btnMissile) && p.mcd <= 0 && p.energy >= mslCost()) fireMissiles();
  const want = (keys.KeyC || keys.KeyV || btnShield) && p.energy > 0 && p.lock <= 0;
  if (want && !p.shieldOn) sfx.shieldOn();
  p.shieldOn = want;
  if (want) { p.energy -= 0.6 * Math.pow(0.88, st.shd); if (p.energy <= 0) { p.energy = 0; p.lock = 90; p.shieldOn = false; sfx.hit(); } }
  else { if (p.lock > 0) p.lock--; p.energy = Math.min(maxEnergy(), p.energy + (p.lock > 0 ? 0.1 : 0.3) * (1 + 0.25 * st.reg)); }

  for (const m of missiles) {
    let t = null, best = 1e9;
    for (const e of enemies) if (!e.dead && e.y > 0) { const d = Math.hypot(e.x - m.x, e.y - m.y); if (d < best) { best = d; t = e; } }
    m.spd = Math.min(9, m.spd + 0.25);
    if (t) {
      const want = Math.atan2(t.y - m.y, t.x - m.x);
      let d = want - m.a; d = Math.atan2(Math.sin(d), Math.cos(d));
      m.a += Math.max(-0.12, Math.min(0.12, d));
    } else { const d = -Math.PI / 2 - m.a; m.a += Math.max(-0.05, Math.min(0.05, Math.atan2(Math.sin(d), Math.cos(d)))); }
    m.vx = Math.cos(m.a) * m.spd; m.vy = Math.sin(m.a) * m.spd;
    m.x += m.vx; m.y += m.vy;
    particles.push({ x: m.x - m.vx * 0.8, y: m.y - m.vy * 0.8, vx: rand(-0.3, 0.3), vy: rand(-0.3, 0.3), life: 12, max: 12, col: '#fb5' });
    if (m.x < -20 || m.x > W + 20 || m.y < -30 || m.y > H + 20) { m.dead = true; continue; }
    const box = { x: m.x, y: m.y, w: 10, h: 10 };
    if (enemies.some(e => !e.dead && e.y > -10 && hitRect(box, e)) || bricks.some(b => !b.dead && hitRect(box, b))) {
      m.dead = true;
      for (const e of enemies) if (!e.dead && e.y > -10 && hitRect(box, e)) { hurtEnemy(e, 6 + 2 * st.msl); break; }
      explode(m.x, m.y);
    }
  }
  missiles = missiles.filter(m => !m.dead);
  enemies = enemies.filter(e => !e.dead);
}

// ---------- Bricks & ball (breakout) ----------
const BRICK_COLS = ['#e33', '#f93', '#fd3', '#4c4', '#39f', '#a5f'];
function spawnBricks() {
  const cols = 8, rows = 4 + Math.min(2, Math.floor(level / 2)), bw = W / cols, pat = (stage - 1) % 5;
  const skip = [(r, c) => r > 1 && (c + r) % 5 === 0, (r, c) => (r + c) % 2 === 1, (r, c) => c < r || c > cols - 1 - r,
    (r, c) => c >= 3 && c <= 4 && r >= 1, (r, c) => (r + c) % 3 === 0][pat];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    if (skip(r, c)) continue; // gaps to let enemies/bullets weave

  }
  ctx.fillStyle = th.star;
  for (const s of stars) { ctx.globalAlpha = 0.3 + s.z * 0.3; ctx.fillRect(s.x, s.y, s.z > 1.2 ? 2 : 1, s.z > 1.2 ? 2 : 1); }
  ctx.globalAlpha = 1;

  if (state !== 'title') {
    for (const u of powerups) {
      const col = { weapon: '#f80', shield: '#0cf', bomb: '#f33', life: '#3f6', ball: '#fff' }[u.kind];
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(u.x, u.y, 10, 0, 6.283); ctx.fill();
      text({ weapon: 'W', shield: 'S', bomb: 'B', life: '+', ball: 'O' }[u.kind], u.x, u.y + 5, 13, '#000', 'center');
    }
    for (const bm of beams) {
      if (bm.t < 70) { ctx.strokeStyle = `rgba(120,255,240,${0.2 + 0.3 * Math.sin(bm.t / 3) ** 2})`; ctx.lineWidth = 1; ctx.setLineDash([6, 8]); ctx.beginPath(); ctx.moveTo(bm.x, 0); ctx.lineTo(bm.x, H); ctx.stroke(); ctx.setLineDash([]); }
      else { const g = ctx.createLinearGradient(bm.x - 16, 0, bm.x + 16, 0); g.addColorStop(0, 'rgba(60,255,230,0)'); g.addColorStop(0.5, 'rgba(255,255,255,0.95)'); g.addColorStop(1, 'rgba(60,255,230,0)'); ctx.fillStyle = g; ctx.fillRect(bm.x - 16, 0, 32, H); }
    }
    for (const b of bricks) {
      ctx.fillStyle = b.flash ? '#fff' : b.col; ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
      ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, 4);
      ctx.strokeStyle = b.hp > 1 ? '#fff' : 'rgba(0,0,0,0.5)'; ctx.lineWidth = b.hp > 1 ? 2 : 1; ctx.strokeRect(b.x - b.w / 2 + .5, b.y - b.h / 2 + .5, b.w - 1, b.h - 1);
    }
    for (const e of enemies) drawEnemy(e);
    for (const m of missiles) { ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(m.a + Math.PI / 2); poly([[0, -8], [3.5, 4], [-3.5, 4]], '#fff', '#f84'); poly([[-3.5, 4], [-6, 8], [-2, 5]], '#f84'); poly([[3.5, 4], [6, 8], [2, 5]], '#f84'); ctx.restore(); }
    for (const ball of balls) {
      const g = ctx.createRadialGradient(ball.x, ball.y, 1, ball.x, ball.y, 14);
      g.addColorStop(0, 'rgba(255,255,255,0.9)'); g.addColorStop(1, 'rgba(120,200,255,0)');
      ctx.fillStyle = g; ctx.fillRect(ball.x - 14, ball.y - 14, 28, 28);
      if (ball.mag) { ctx.strokeStyle = 'rgba(120,220,255,0.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(ball.x, ball.y); ctx.stroke(); }
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, 6.283); ctx.fill();
    }
    ctx.fillStyle = '#9ff'; for (const b of bullets) ctx.fillRect(b.x - 2, b.y - 7, 4, 14);
    ctx.fillStyle = '#f6a'; for (const b of ebullets) { ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, 6.283); ctx.fill(); }
    if (state !== 'over') drawPlayer();
    for (const q of particles) { ctx.globalAlpha = q.life / q.max; ctx.fillStyle = q.col; ctx.fillRect(q.x - 1.5, q.y - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    // HUD
    text('SCORE ' + String(score).padStart(7, '0'), 10, 24, 16);
    text('HI ' + String(hi).padStart(7, '0'), W - 10, 24, 16, '#fd5', 'right');
    text('STAGE ' + stage, W / 2, 24, 14, '#8f8', 'center');
    // ship level + xp bar
    text('SHIP LV ' + player.lvl, 10, 44, 12, '#8ef');
    ctx.fillStyle = '#123'; ctx.fillRect(90, 35, 120, 7); ctx.fillStyle = '#4fa'; ctx.fillRect(90, 35, 120 * player.xp / player.xpNext, 7);
    ctx.strokeStyle = '#8ab'; ctx.lineWidth = 1; ctx.strokeRect(90.5, 35.5, 120, 7);
    if (banner.t > 0) {
      const warn = banner.l1 === 'WARNING';
      ctx.globalAlpha = Math.min(1, banner.t / 40);
      text(banner.l1, W / 2, 300, 22, warn ? '#f55' : '#8ef', 'center');
      text(banner.l2, W / 2, 338, 34, warn ? '#fd5' : '#fff', 'center');
      ctx.globalAlpha = 1;
    }
    if (player.lvlFlash > 0) text('LEVEL UP!', player.x, player.y - 40 - (90 - player.lvlFlash) * 0.3, 16, `rgba(150,255,150,${Math.min(1, player.lvlFlash / 30)})`, 'center');
    // energy bar
    const ep = player.energy / maxEnergy();
    ctx.fillStyle = '#012'; ctx.fillRect(10, H - 44, 100, 8);
    ctx.fillStyle = player.lock > 0 ? '#f44' : ep < 0.2 ? '#fa4' : '#4df'; ctx.fillRect(10, H - 44, 100 * ep, 8);
    ctx.strokeStyle = '#8ab'; ctx.lineWidth = 1; ctx.strokeRect(10.5, H - 43.5, 100, 8);
    text('ENERGY', 114, H - 36, 11, '#8ab');
    if (usedTouch) for (const [b, label, on] of [[BTN_M, 'MSL', btnMissile], [BTN_S, 'SHD', btnShield]]) {
      ctx.globalAlpha = on ? 0.7 : 0.35; ctx.fillStyle = b === BTN_M ? '#f84' : '#4df';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.283); ctx.fill(); ctx.globalAlpha = 1;
      text(label, b.x, b.y + 5, 14, '#fff', 'center');
    }
    for (let i = 0; i < player.lives; i++) drawLifeIcon(20 + i * 18, H - 16);
    text('BOMBS ' + '●'.repeat(player.bombs), W - 10, H - 10, 14, '#f66', 'right');
    if (combo > 1) text('COMBO x' + combo, W / 2, 48, 16, '#fd5', 'center');
    text('PWR ' + player.weapon, W / 2, H - 10, 14, '#fa4', 'center');
  }
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash / 30})`; ctx.fillRect(0, 0, W, H); }
  ctx.restore();

  if (state === 'title') {
    text('STARFIGHTER', W / 2, 250, 48, '#6cf', 'center');
    text('— ARCADE —', W / 2, 285, 18, '#fd5', 'center');
    if (Math.floor(frame / 30) % 2 === 0 || true) text('PRESS ENTER / TAP TO START', W / 2, 390, 18, Math.floor(Date.now() / 500) % 2 ? '#fff' : '#888', 'center');
    text('ARROWS / WASD / IJKL / NUMPAD  move', W / 2, 460, 14, '#aaa', 'center');
    text('SPACE / NUM0 fire   X missiles   C shield   B bomb', W / 2, 484, 14, '#aaa', 'center');
    text('O power-up: bounce the ball off your ship', W / 2, 532, 14, '#aaa', 'center');
    text('P  pause     touch: drag to fly', W / 2, 508, 14, '#aaa', 'center');
    text('HI ' + hi, W / 2, 590, 16, '#fd5', 'center');
  } else if (state === 'pause') {
    text('PAUSED', W / 2, 200, 40, '#fff', 'center');
    text('SHIP LEVEL ' + player.lvl, W / 2, 250, 18, '#8ef', 'center');
    let row = 0;
    for (const u of UPGRADES) if (!u.noLevel && st[u.id]) text(u.name + '  Lv ' + st[u.id], W / 2, 290 + 24 * row++, 15, '#cde', 'center');
    if (!row) text('No upgrades yet', W / 2, 290, 15, '#789', 'center');
  } else if (state === 'upgrade') {
    ctx.fillStyle = 'rgba(0,0,10,0.75)'; ctx.fillRect(0, 0, W, H);
    text('LEVEL UP!', W / 2, 90, 40, '#8f8', 'center');
    text('Ship level ' + player.lvl + ' — choose an upgrade', W / 2, 125, 16, '#cde', 'center');
    text('(press 1 / 2 / 3 or tap a card)', W / 2, 150, 13, '#789', 'center');
    upChoices.forEach((u, i) => {
      const y = CARD_Y + i * 120, ready = frame - upFrame >= 30;
      ctx.globalAlpha = ready ? 1 : 0.5;
      ctx.fillStyle = '#0b1830'; ctx.fillRect(40, y, W - 80, 106);
      ctx.strokeStyle = '#4af'; ctx.lineWidth = 2; ctx.strokeRect(40, y, W - 80, 106);
      text('[' + (i + 1) + ']', 58, y + 38, 22, '#fd5');
      text(u.name, 110, y + 36, 22, '#fff');
      text(u.desc, 110, y + 62, 13, '#9bd');
      text(u.noLevel ? 'Instant' : 'Lv ' + st[u.id] + ' → ' + (st[u.id] + 1), 110, y + 88, 14, '#8f8');
      ctx.globalAlpha = 1;
    });
  } else if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, W, H);
    text('GAME OVER', W / 2, 290, 44, '#f55', 'center');
    text('SCORE ' + score, W / 2, 340, 22, '#fff', 'center');
    text('Reached ship level ' + player.lvl, W / 2, 400, 15, '#8ef', 'center');
    if (score >= hi && score > 0) text('NEW HIGH SCORE!', W / 2, 372, 18, '#fd5', 'center');
    text('PRESS ENTER / TAP TO RETRY', W / 2, 430, 16, Math.floor(Date.now() / 500) % 2 ? '#fff' : '#888', 'center');
  }
}

// ---------- Loop (fixed 60Hz step) ----------
let last = performance.now(), acc = 0;
function loop(t) {
  acc += Math.min(100, t - last); last = t;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
